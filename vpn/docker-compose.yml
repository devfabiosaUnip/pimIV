# VPN corporativa (WireGuard) + API exposta apenas na rede interna
# Uso: docker compose -f vpn/docker-compose.yml up -d

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: manutencao-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - SERVERURL=SEU_IP_PUBLICO_OU_DDNS
      - SERVERPORT=51820
      - PEERS=tecnico1,tecnico2,operador1
      - PEERDNS=10.8.0.1
      - INTERNAL_SUBNET=10.8.0.0
      - ALLOWEDIPS=10.8.0.0/24,172.20.0.0/24
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - intranet

  api:
    build:
      context: ..
      dockerfile: vpn/Dockerfile.api
    container_name: manutencao-api
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Vpn__RequireVpn=true
      - ConnectionStrings__Default=Data Source=/data/manutencao.db
    volumes:
      - api-data:/data
    networks:
      - intranet
    depends_on:
      - wireguard

networks:
  intranet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  api-data:
